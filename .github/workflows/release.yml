name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p build/${{ matrix.goos }}_${{ matrix.goarch }}/netutility/bin

        # Build main binary
        go build -v -ldflags="-s -w" -o build/${{ matrix.goos }}_${{ matrix.goarch }}/netutility/netutil ./cmd/netutil

        # Build helper binaries
        go build -v -ldflags="-s -w" -o build/${{ matrix.goos }}_${{ matrix.goarch }}/netutility/bin/ouihelper ./cmd/ouihelper
        go build -v -ldflags="-s -w" -o build/${{ matrix.goos }}_${{ matrix.goarch }}/netutility/bin/netutil-fileserver ./cmd/fileserver

    - name: Copy scripts
      run: |
        cp -r scripts build/${{ matrix.goos }}_${{ matrix.goarch }}/netutility/

    - name: Create archive
      run: |
        cd build/${{ matrix.goos }}_${{ matrix.goarch }}
        tar -czf netutility-${{ steps.get_version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz netutility
        sha256sum netutility-${{ steps.get_version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > netutility-${{ steps.get_version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: netutility-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          build/${{ matrix.goos }}_${{ matrix.goarch }}/*.tar.gz
          build/${{ matrix.goos }}_${{ matrix.goarch }}/*.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/**/*.tar.gz
          artifacts/**/*.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
