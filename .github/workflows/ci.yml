name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x', 'stable']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.go-version }}
        path: coverage.txt
        retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    # TODO: Remove continue-on-error once pre-existing lint backlog is resolved
    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.4
    - name: Run golangci-lint
      continue-on-error: true
      run: golangci-lint run ./...
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run shellcheck
      run: |
        # Shellcheck is pre-installed on ubuntu-latest runners
        find scripts -type f -name "*.sh" -exec shellcheck --severity=warning {} +

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [test, lint, shellcheck]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-build-

    - name: Get version
      id: get_version
      run: echo "VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Build netutil
      run: go build -v -ldflags="-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o netutil ./cmd/netutil

    - name: Build ouihelper
      run: go build -v -ldflags="-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o bin/ouihelper ./cmd/ouihelper

    - name: Build netutil-fileserver
      run: go build -v -ldflags="-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o bin/netutil-fileserver ./cmd/fileserver

    - name: Verify binaries
      run: |
        test -f netutil
        test -f bin/ouihelper
        test -f bin/netutil-fileserver
        ./netutil --version
        ./bin/ouihelper --version
        ./bin/netutil-fileserver --help || true
