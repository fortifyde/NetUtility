script:
  name: "Log Management"
  description: "View and manage NetUtility logs"
  name_de: "Protokollierung verwalten"
  description_de: "NetUtility Protokollierung anzeigen und verwalten"
  category: "utilities"
  subcategory: "logging"

  file: "log_management.sh"
  requires_root: true
  estimated_duration: "1-5 minutes"

  cli_shortcuts:
    - "logs"
  keywords:
    - "logs"
    - "logging"
    - "management"
    - "export"
    - "rotate"
    - "level"

  parameters:
    - name: "operation"
      type: "choice"
      description: "Log operation to perform"
      required: true
      default: "1"
      validation:
        choices:
          - value: "1"
            description: "View log statistics"
          - value: "2"
            description: "View recent log entries"
          - value: "3"
            description: "Search logs"
          - value: "4"
            description: "Clear logs"
          - value: "5"
            description: "Rotate logs manually"
          - value: "6"
            description: "Set log level"
          - value: "7"
            description: "Export logs"
          - value: "8"
            description: "Exit"

  dependencies:
    tools:
      - name: "grep"
        package: "grep"
        check_command: "which grep"
      - name: "tar"
        package: "tar"
        check_command: "which tar"
      - name: "sed"
        package: "sed"
        check_command: "which sed"

  output:
    creates_files: true
    file_patterns:
      - "netutil_logs_*.txt"
      - "netutil_logs_complete_*.tar.gz"
    workspace_subdirs:
      - "log_exports"

  tags:
    - "logs"
    - "system"
    - "monitoring"
    - "troubleshooting"
  risk_level: "low"
  network_access: false
  modifies_system: true

  examples:
    - description: "View and manage logs"
      command: "netutil logs"

  version: "1.0"
  last_updated: "2025-04-25"
