script:
  name: "Restore Configuration"
  description: "Restore network configuration from backup archives"
  name_de: "Konfiguration wiederherstellen"
  description_de: "Netzwerkkonfiguration aus Sicherungsarchiven wiederherstellen"
  category: "utilities"
  subcategory: "backup"

  file: "restore_config.sh"
  requires_root: true
  estimated_duration: "1-3 minutes"

  cli_shortcuts:
    - "restore"
  keywords:
    - "restore"
    - "configuration"
    - "backup"
    - "recover"
    - "network"

  parameters: []

  dependencies:
    tools:
      - name: "tar"
        package: "tar"
        check_command: "which tar"
      - name: "gzip"
        package: "gzip"
        check_command: "which gzip"
      - name: "ip"
        package: "iproute2"
        check_command: "which ip"
      - name: "grep"
        package: "grep"
        check_command: "which grep"
      - name: "sed"
        package: "sed"
        check_command: "which sed"

  output:
    creates_files: true
    workspace_subdirs:
      - "netutil_backups"

  tags:
    - "restore"
    - "configuration"
    - "backup"
    - "recovery"
  risk_level: "high"
  network_access: false
  modifies_system: true

  examples:
    - description: "Restore network configuration"
      command: "netutil restore"

  version: "1.0"
  last_updated: "2025-04-25"
