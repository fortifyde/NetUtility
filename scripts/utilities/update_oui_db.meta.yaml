script:
  name: "Update OUI Database"
  description: "Download and update the IEEE OUI database for MAC address vendor identification (REQUIRES INTERNET)"
  name_de: "OUI-Datenbank aktualisieren"
  description_de: "IEEE-OUI-Datenbank für MAC-Adressen-Herstelleridentifikation herunterladen und aktualisieren (ERFORDERT INTERNET)"
  category: "utilities"
  subcategory: "database"

  file: "update_oui_db.sh"
  requires_root: false
  estimated_duration: "1-3 minutes"

  cli_shortcuts:
    - "update-oui"
  keywords:
    - "oui"
    - "database"
    - "update"
    - "mac"
    - "vendor"
    - "ieee"

  parameters: []

  dependencies:
    tools:
      - name: "wget or curl"
        package: "wget or curl"
        check_command: "command -v wget || command -v curl"

  output:
    creates_files: true
    file_patterns:
      - "oui.txt"
      - "oui_backup_*.txt"
    workspace_subdirs: []

  tags:
    - "database"
    - "oui"
    - "mac-address"
    - "vendor"
    - "ieee"
    - "update"
  risk_level: "low"
  network_access: true
  modifies_system: false

  examples:
    - description: "Update OUI database"
      command: "netutil update-oui"

  version: "1.0"
  last_updated: "2025-04-25"
