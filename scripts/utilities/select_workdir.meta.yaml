script:
  name: "Select Working Directory"
  description: "Choose and configure the working directory for NetUtility operations"
  name_de: "Arbeitsverzeichnis auswählen"
  description_de: "Arbeitsverzeichnis für NetUtility-Vorgänge neu konfigurieren"
  category: "utilities"
  subcategory: "configuration"

  file: "select_workdir.sh"
  requires_root: false
  estimated_duration: "1 minute"

  cli_shortcuts:
    - "workdir"
  keywords:
    - "workdir"
    - "workspace"
    - "directory"
    - "configuration"
    - "setup"

  parameters:
    - name: "directory_path"
      type: "directory"
      description: "Path to working directory"
      required: false

  dependencies:
    tools:
      - name: "mktemp"
        package: "coreutils"
        check_command: "which mktemp"

  output:
    creates_files: true
    workspace_subdirs:
      - "captures"
      - "discovery"
      - "scans"
      - "analysis"
      - "reports"
      - "configs"
      - "logs"
      - "latest"

  tags:
    - "workspace"
    - "configuration"
    - "setup"
    - "directory"
  risk_level: "low"
  network_access: false
  modifies_system: false

  examples:
    - description: "Select working directory"
      command: "netutil workdir"

  version: "1.0"
  last_updated: "2025-04-25"
