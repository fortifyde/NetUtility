script:
  name: "Exclude Team IPs"
  description: "Detect audit team systems via MAC/vendor matching and remove their IPs from all discovery outputs"
  name_de: "Team-IPs ausschließen"
  description_de: "IPs der Team-Systeme aus allen Discovery-Ergebnissen entfernen"
  category: "utilities"
  subcategory: "discovery-cleanup"

  file: "exclude_team_ips.sh"
  requires_root: false
  estimated_duration: "30 seconds"

  cli_shortcuts:
    - "exclude-team"
  keywords:
    - "team"
    - "exclude"
    - "filter"
    - "cleanup"
    - "mac"
    - "oui"
    - "vendor"

  parameters:
    - name: "file"
      type: "file"
      description: "Provide a file of IPs to exclude (one per line)"
      required: false

  dependencies:
    tools:
      - name: "ip"
        package: "iproute2"
        check_command: "which ip"
      - name: "jq"
        package: "jq"
        check_command: "which jq"
      - name: "ouihelper"
        package: "netutil"
        check_command: "which ouihelper"

  output:
    creates_files: true
    modifies_files: true
    file_patterns:
      - "excluded_hosts.json"
    workspace_subdirs:
      - "discovery"

  tags:
    - "discovery"
    - "cleanup"
    - "team"
    - "mac"
    - "vendor"
  risk_level: "medium"
  network_access: false
  modifies_system: false

  examples:
    - description: "Run team IP exclusion with auto-detection"
      command: "netutil exclude-team"

  version: "1.0"
  last_updated: "2025-04-25"
