script:
  name: "Safe NSE Service Enumeration Scan"
  description: "Comprehensive port scan with safe NSE service enumeration (non-intrusive)"
  category: "scanning"
  subcategory: "enumeration"

  file: "safe_nse_scan.sh"
  requires_root: true
  estimated_duration: "5-30 minutes"

  cli_shortcuts:
    - "safe-scan"
    - "enum"
    - "service-enum"
  keywords:
    - "enumeration"
    - "scan"
    - "nse"
    - "nmap"
    - "safe"
    - "service"
    - "ports"

  parameters:
    - name: "target"
      type: "target"
      description: "Target IP, range, or host file"
      required: true
    - name: "scan_intensity"
      type: "choice"
      description: "Scan intensity level"
      required: true
      default: "1"
      validation:
        choices:
          - value: "1"
            description: "Quick scan (Top 1000 ports)"
          - value: "2"
            description: "Comprehensive scan (All 65535 ports)"
          - value: "3"
            description: "Custom port range"
    - name: "custom_ports"
      type: "text"
      description: "Custom port range (e.g., 1-1000 or 80,443,8080)"
      required: false
      validation:
        pattern: '^([0-9]+(-[0-9]+)?)(,[0-9]+(-[0-9]+)?)*$'

  dependencies:
    tools:
      - name: "nmap"
        package: "nmap"
        check_command: "which nmap"
    scripts:
      - "../common/utils.sh"

  output:
    creates_files: true
    file_patterns:
      - "service_scan_*.txt"
      - "nse_enum_*.txt"
      - "service_report_*.txt"
    workspace_subdirs:
      - "vulnerability"

  tags:
    - "enumeration"
    - "service-discovery"
    - "safe"
    - "nse"
    - "port-scanning"
    - "inventory"
  risk_level: "low"
  network_access: true
  modifies_system: false

  examples:
    - description: "Run safe service enumeration"
      command: "netutil safe-scan"
    - description: "Quick safe scan"
      command: "netutil enum"

  version: "1.0"
  author: "fortifyde"
  last_updated: "2025-01-18"
