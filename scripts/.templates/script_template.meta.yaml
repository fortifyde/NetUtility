# Minimal script metadata template.
# Required fields: name, file, category. Everything else is optional.
# Optional fields shown here: description, parameters, output.
# Script language is taken from the script's shebang line, not from metadata.

script:
  name: "Script Template"
  description: "Template demonstrating required metadata fields"
  category: "template"
  file: "script_template.sh"

  parameters:
    - name: "interface"
      type: "interface"
      description: "Network interface for demonstration"
      required: true
    - name: "target"
      type: "target"
      description: "Target for demonstration (IP, range, or file)"
      required: true
    - name: "timeout"
      type: "number"
      description: "Timeout in seconds"
      required: false
      default: "300"
      validation:
        range:
          min: 1
          max: 3600

  output:
    creates_files: true
    file_patterns:
      - "template_output_*.txt"
    workspace_subdirs:
      - "template-results"
