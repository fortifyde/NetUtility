script:
  name: "Network Config Gatherer"
  description: "SSH into network devices, auto-detect vendor, and extract running configs and compliance data"
  name_de: "ALK Sammler"
  description_de: "Aktive Lan-Komponenten gebündelt per SSH auslesen. Sammlung von Running-Configs sowie Compliance-Daten"
  category: "config-gathering"
  subcategory: "backup"

  file: "gather_network_configs.sh"
  requires_root: false
  estimated_duration: "5-30 minutes"

  cli_shortcuts:
    - "gather-configs"
  keywords:
    - "config"
    - "configuration"
    - "backup"
    - "gather"
    - "extract"
    - "compliance"
    - "network"
    - "device"
    - "cisco"
    - "hp"
    - "aruba"

  parameters:
    - name: "targets"
      type: "target"
      description: "Device IP, range, or categorized host file (--targets)"
      required: false
    - name: "dry_run"
      type: "boolean"
      description: "Test connectivity only, no extraction (--dry-run)"
      required: false
      default: "false"
    - name: "cred_mode"
      type: "choice"
      description: "Credential input method (--cred-mode)"
      required: false
      default: "prompt"
      validation:
        choices:
          - value: "prompt"
            description: "Common username/password for all devices"
          - value: "session"
            description: "Use session-stored credentials"
          - value: "file"
            description: "Credentials file (IP,user,pass format)"
    - name: "cred_file"
      type: "file_path"
      description: "Path to credentials file (--cred-file)"
      required: false
    - name: "concurrency"
      type: "number"
      description: "Maximum parallel connections (--concurrency)"
      required: false
      default: "5"

  dependencies:
    tools:
      - name: "ssh"
        package: "openssh-client"
        check_command: "which ssh"
      - name: "sshpass"
        package: "sshpass"
        check_command: "which sshpass"
      - name: "sed"
        package: "sed"
        check_command: "which sed"
      - name: "grep"
        package: "grep"
        check_command: "which grep"
    optional_tools:
      - name: "expect"
        package: "expect"
        check_command: "which expect"
        note: "Enables reliable paginated output collection for PTY-mode devices (e.g. Cisco Nexus)"

  output:
    creates_files: true
    workspace_subdirs: ["configs"]
    files:
      - path: "configs/*/version.txt"
        description: "Device version information"
      - path: "configs/*/running_config.txt"
        description: "Running configuration"
      - path: "configs/*/running_config_all.txt"
        description: "Running configuration with all defaults"
      - path: "configs/*/startup_config.txt"
        description: "Startup/saved configuration"
      - path: "configs/*/compliance_commands.txt"
        description: "Additional compliance command outputs"
      - path: "configs/*/metadata.txt"
        description: "Device metadata and session info"
      - path: "configs/*/connection.log"
        description: "Connection log"
      - path: "configs/failures.txt"
        description: "Failed device log"
    logs_operations: true

  tags:
    - "configuration"
    - "backup"
    - "compliance"
    - "network-devices"
    - "cisco"
    - "hp"
    - "aruba"
    - "automation"
  risk_level: "low"
  network_access: true
  modifies_system: false

  examples:
    - description: "Interactive extraction with common credentials"
      command: "netutil gather-configs"
    - description: "Dry-run to test connectivity"
      command: "./gather_network_configs.sh --dry-run"
    - description: "Extract from categorized network devices"
      command: "netutil gather-configs --targets /path/to/network_devices.txt"
    - description: "High concurrency extraction"
      command: "./gather_network_configs.sh --concurrency 10"
    - description: "Use credentials file"
      command: "./gather_network_configs.sh --cred-mode file --cred-file creds.csv"

  notes:
    - "Supports Cisco IOS, Cisco Nexus, HP Comware, HP ProVision, HP Aruba"
    - "Automatically detects vendor/OS from version output"
    - "Saves running-config and running-config all separately"
    - "Uses fallback version commands for compatibility"
    - "Offers retry on failures with different credentials"
    - "Clean output with pagination and ANSI codes removed"
    - "Command lists customizable per vendor in commands/ directory"
    - "Detects truncated output from pagination failures with layered fallbacks"
    - "Uses expect (optional) for reliable paginated output when terminal paging cannot be disabled"
    - "Existing config files are timestamped on re-collection; canonical names always point to latest"
    - "Per-IP directory layout: configs/<IP>/ with no session wrapper"

  version: "2.0.0"
  last_updated: "2026-05-02"