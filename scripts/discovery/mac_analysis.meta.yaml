script:
  name: "MAC Address Analysis"
  description: "Analyze MAC addresses from network capture to identify device vendors, detect anomalies, and perform security analysis including MAC randomization and multicast/broadcast detection"
  name_de: "MAC-Adressanalyse"
  description_de: "MAC-Adressen aus Netzwerkmitschnitt analysieren zur Gerätehersteller-Identifikation, Anomalie-Erkennung und Sicherheitsanalyse inklusive MAC-Randomisierung und Multicast/Broadcast-Erkennung"
  category: "discovery"
  subcategory: "analysis"

  file: "mac_analysis.sh"
  requires_root: false
  estimated_duration: "0-5 minutes"

  cli_shortcuts:
    - "mac-analysis"
  keywords:
    - "mac"
    - "vendor"
    - "analysis"
    - "security"
    - "randomization"
    - "oui-database"
    - "ouihelper"
    - "devices"

  parameters:
    - name: "capture_file"
      type: "file_path"
      description: "Capture file (.pcap) to analyze for MAC addresses"
      required: true

  dependencies:
    tools:
      - name: "tshark"
        package: "wireshark-cli"
        check_command: "which tshark"
      - name: "ouihelper"
        package: "netutility-built-in"
        check_command: "which ouihelper"

  output:
    creates_files: true
    file_patterns:
      - "mac_analysis_*_*.txt"
    workspace_subdirs:
      - "analysis"

  tags:
    - "mac"
    - "vendor"
    - "analysis"
    - "security"
    - "forensics"
  risk_level: "low"
  network_access: false
  modifies_system: false

  examples:
    - description: "Analyze MAC addresses from a capture file"
      command: "netutil mac-analysis"

  version: "1.0"
  last_updated: "2025-04-25"
