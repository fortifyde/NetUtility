script:
  name: "Packet Capture Analysis"
  description: "Analyze pcap files for WPAD detection, Windows domain discovery via BROWSER protocol, SSDP service discovery, STP topology analysis, IPv4 endpoint mapping, VLAN correlation, MAC OUI identification, and protocol-level security assessment"
  name_de: "Netzwerkmitschnitt Analyse"
  description_de: "pcap-Dateien auf Protokollstatistiken und grundliegende Sicherheitsmängel analysieren"
  category: "discovery"
  subcategory: "analysis"

  file: "advanced_packet_analysis.sh"
  requires_root: true
  estimated_duration: "5-15 minutes"

  cli_shortcuts:
    - "packet-analysis"
  keywords:
    - "packet"
    - "analysis"
    - "protocol"
    - "statistics"
    - "security"
    - "wireshark"
    - "wpad"
    - "ssdp"
    - "stp"
    - "domain"
    - "endpoint"
    - "vlan"
    - "browser-protocol"

  parameters:
    - name: "capture_file"
      type: "file"
      description: "Packet capture file to analyze"
      required: false

  dependencies:
    tools:
      - name: "tshark"
        package: "wireshark"
        check_command: "which tshark"

  output:
    creates_files: true
    file_patterns:
      - "advanced_analysis_*_*.txt"
    workspace_subdirs:
      - "analysis"

  tags:
    - "packet-analysis"
    - "protocol-analysis"
    - "security"
    - "statistics"
    - "wireshark"
  risk_level: "low"
  network_access: false
  modifies_system: false

  examples:
    - description: "Analyze packet capture"
      command: "netutil packet-analysis"

  version: "1.0"
  last_updated: "2025-04-25"
