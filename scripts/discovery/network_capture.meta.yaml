script:
  name: "Network Capture"
  description: "Capture network traffic with tshark, extract VLAN information, and perform security analysis for unsafe protocols"
  name_de: "Netzwerkmitschnitt"
  description_de: "Netzwerkmitschnitt aufzeichnen und mit erweiterten Filteroptionen analysieren"
  category: "discovery"
  subcategory: "capture"

  file: "network_capture.sh"
  requires_root: true
  estimated_duration: "5 minutes to 24+ hours (configurable)"

  cli_shortcuts:
    - "capture"
  keywords:
    - "capture"
    - "tshark"
    - "packets"
    - "traffic"
    - "network"
    - "security"
    - "vlan"
    - "analysis"
    - "pcap"
    - "wireshark"

  parameters:
    - name: "interface"
      type: "interface"
      description: "Network interface to capture from"
      required: true
    - name: "duration"
      type: "duration"
      description: "Capture duration in seconds (0 for manual stop via Ctrl+C)"
      required: false
      default: "600"
      validation:
        range:
          min: 0
          max: 86400

  dependencies:
    tools:
      - name: "tshark"
        package: "tshark"
        check_command: "which tshark"
      - name: "capinfos"
        package: "tshark"
        check_command: "which capinfos"
      - name: "ip"
        package: "iproute2"
        check_command: "which ip"

  output:
    creates_files: true
    file_patterns:
      - "capture_*.pcap"
      - "vlans_*.txt"
      - "security_analysis_*.txt"
    workspace_subdirs:
      - "captures"

  tags:
    - "capture"
    - "analysis"
    - "traffic"
    - "monitoring"
  risk_level: "medium"
  network_access: true
  modifies_system: true

  examples:
    - description: "Capture network traffic with tshark"
      command: "netutil capture"

  version: "1.0"
  last_updated: "2025-04-25"
