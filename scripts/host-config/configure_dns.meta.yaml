script:
  name: "Configure DNS"
  description: "Manage DNS configuration and nameserver settings"
  name_de: "DNS konfigurieren"
  description_de: "DNS-Konfiguration und Nameserver-Einstellungen verwalten"
  category: "host-config"
  subcategory: "networking"

  file: "configure_dns.sh"
  requires_root: true
  estimated_duration: "1-3 minutes"

  cli_shortcuts:
    - "dns"
  keywords:
    - "dns"
    - "nameserver"
    - "resolv"
    - "systemd-resolved"
    - "configuration"
    - "backup"
    - "restore"

  parameters:
    - name: "operation"
      type: "choice"
      description: "DNS operation to perform"
      required: true
      default: "1"
      validation:
        choices:
          - value: "1"
            description: "Add nameserver"
          - value: "2"
            description: "Remove nameserver"
          - value: "3"
            description: "Set search domain"
          - value: "4"
            description: "Backup current configuration"
          - value: "5"
            description: "Restore from backup"
          - value: "6"
            description: "Exit"

  dependencies:
    tools:
      - name: "systemctl"
        package: "systemd"
        check_command: "which systemctl"

  output:
    creates_files: true
    file_patterns:
      - "/tmp/resolv.conf.backup.*"
    workspace_subdirs: []

  tags:
    - "dns"
    - "networking"
    - "system-configuration"
  risk_level: "medium"
  network_access: false
  modifies_system: true

  examples:
    - description: "Configure DNS settings"
      command: "netutil dns"

  version: "1.0"
  last_updated: "2025-04-25"
