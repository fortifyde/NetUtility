script:
  name: "Manage VLAN Interfaces"
  description: "Create, configure, and remove VLAN subinterfaces including batch/multiple VLAN operations"
  name_de: "VLAN-Schnittstellen verwalten"
  description_de: "VLAN-Schnittstellen erstellen, konfigurieren und entfernen inklusive Batch-Operationen"
  category: "host-config"
  subcategory: "networking"

  file: "add_vlan.sh"
  requires_root: true
  estimated_duration: "1-2 minutes"

  cli_shortcuts:
    - "vlan"
  keywords:
    - "vlan"
    - "interface"
    - "subinterface"
    - "tagging"
    - "802.1q"
    - "batch"
    - "multiple"
    - "bulk"

  parameters:
    - name: "parent_interface"
      type: "interface"
      description: "Parent interface for VLAN creation"
      required: true
    - name: "operation"
      type: "choice"
      description: "VLAN operation to perform"
      required: true
      default: "1"
      validation:
        choices:
          - value: "1"
            description: "Add VLAN interface"
          - value: "2"
            description: "Add Multiple VLAN interfaces (batch)"
          - value: "3"
            description: "Remove VLAN interface"
          - value: "4"
            description: "List VLAN interfaces"
          - value: "5"
            description: "Exit"
    - name: "vlan_id"
      type: "number"
      description: "VLAN ID (1-4094)"
      required: false
      validation:
        range:
          min: 1
          max: 4094
    - name: "ip_address"
      type: "ip_address"
      description: "IP address with CIDR for the VLAN interface"
      required: false
      validation:
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$'

  dependencies:
    tools:
      - name: "ip"
        package: "iproute2"
        check_command: "which ip"

  output:
    creates_files: false
    workspace_subdirs: []

  tags:
    - "vlan"
    - "networking"
    - "interface-management"
    - "layer2"
  risk_level: "medium"
  network_access: false
  modifies_system: true

  examples:
    - description: "Manage VLAN interfaces"
      command: "netutil vlan"

  version: "1.0"
  last_updated: "2025-04-25"
