script:
  name: "Setup File Server"
  description: "Configure HTTP(s) file server with authentication for sharing scan results across VLANs"
  name_de: "Webserver einrichten"
  description_de: "HTTP(s)-Dateiserver mit Authentifizierung zum Teilen von Scan-Ergebnissen über VLANs hinweg konfigurieren"
  category: "host-config"
  subcategory: "services"

  file: "setup_file_server.sh"
  requires_root: true
  estimated_duration: "3-5 minutes"

  cli_shortcuts:
    - "setup-fileserver"
  keywords:
    - "file"
    - "server"
    - "http"
    - "share"
    - "authentication"
    - "vlan"
    - "service"
    - "systemd"

  parameters:
    - name: "port"
      type: "number"
      description: "Server port"
      required: false
      default: "8080"
    - name: "listen_address"
      type: "string"
      description: "Listen address"
      required: false
      default: "0.0.0.0"
    - name: "enable_tls"
      type: "string"
      description: "Enable HTTPS/TLS encryption (y/n)"
      required: false
      default: "y"
    - name: "username"
      type: "string"
      description: "Authentication username"
      required: false
    - name: "password"
      type: "string"
      description: "Authentication password"
      required: false

  dependencies:
    tools:
      - name: "openssl"
        package: "openssl"
        check_command: "which openssl"
      - name: "ip"
        package: "iproute2"
        check_command: "which ip"
      - name: "hostname"
        package: "hostname"
        check_command: "which hostname"
      - name: "systemctl"
        package: "systemd"
        check_command: "which systemctl"
      - name: "netutil-fileserver"
        package: "netutil"
        check_command: "command -v netutil-fileserver"
    binaries:
      - name: "netutil-fileserver"
        description: "File server binary (must be installed in PATH)"

  output:
    creates_files: true
    files:
      - path: "/etc/systemd/system/netutil-fileserver.service"
        description: "Systemd service file"
      - path: "/etc/netutil/fileserver.creds"
        description: "Credentials file with bcrypt hashes"
    workspace_subdirs: []
    logs_operations: true

  tags:
    - "networking"
    - "service"
    - "http"
    - "authentication"
    - "file-sharing"
    - "vlan"
    - "systemd"
  risk_level: "medium"
  network_access: true
  modifies_system: true

  examples:
    - description: "Run setup wizard"
      command: "netutil setup-fileserver"
    - description: "Direct execution"
      command: "sudo ./scripts/host-config/setup_file_server.sh"

  notes:
    - "Requires netutil-fileserver binary installed in PATH"
    - "Creates systemd service for automatic startup"
    - "Uses bcrypt for password hashing"
    - "Manual firewall/VLAN configuration required for cross-VLAN access"
    - "Default port 8080, configurable during setup"

  version: "1.0"
  last_updated: "2025-04-25"
