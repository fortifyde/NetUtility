script:
  name: "Manage Network Interfaces"
  description: "Manage network interface states (up/down) and VLAN interface control"
  name_de: "Netzwerkschnittstellen verwalten"
  description_de: "Netzwerkschnittstellenstatus verwalten und VLAN-Schnittstellen steuern"
  category: "host-config"
  subcategory: "networking"

  file: "network_interfaces.sh"
  requires_root: true
  estimated_duration: "1-5 minutes"

  cli_shortcuts:
    - "interfaces"
  keywords:
    - "interfaces"
    - "network"
    - "ethernet"
    - "configuration"

  parameters:
    - name: "operation"
      type: "choice"
      description: "Interface operation to perform"
      required: true
      default: "1"
      validation:
        choices:
          - value: "1"
            description: "Bring interface UP"
          - value: "2"
            description: "Bring interface DOWN"
          - value: "3"
            description: "Bring all VLAN interfaces UP"
          - value: "4"
            description: "Bring all VLAN interfaces DOWN"
          - value: "5"
            description: "Show interface statistics"
          - value: "6"
            description: "Exit"

  dependencies:
    tools:
      - name: "ip"
        package: "iproute2"
        check_command: "which ip"

  output:
    creates_files: false
    workspace_subdirs: []

  tags:
    - "interfaces"
    - "networking"
    - "ethernet"
  risk_level: "medium"
  network_access: false
  modifies_system: true

  examples:
    - description: "Manage network interfaces"
      command: "netutil interfaces"

  version: "1.0"
  last_updated: "2025-04-25"
