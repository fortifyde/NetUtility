version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - goconst
    - gocyclo
    - misspell

  settings:
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G204  # Subprocess execution (intentional for script runner)
    goconst:
      min-len: 4
      min-occurrences: 4

  exclusions:
    rules:
      - path: internal/ui/i18n\.go
        linters:
          - misspell

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
